name: NutriCore
options:
  bundleIdPrefix: com.nutricore
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.0.0

targets:
  NutriCore:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - package: Supabase
    sources:
      - path: Sources/NutriCore
        createIntermediateGroups: true
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/Fonts
    info:
      path: NutriCore/Info.plist
      properties:
        CFBundleDisplayName: Primal
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - PressStart2P-Regular.ttf
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSCameraUsageDescription: "We need access to your camera to scan barcodes and detect food items."
        NSLocationWhenInUseUsageDescription: "We need your location to find local butchers and farms near you."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omsilwal.NutriCorePrimal
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
