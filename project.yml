name: NutriCore
options:
  bundleIdPrefix: com.nutricore
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.0.0

targets:
  NutriCore:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    dependencies:
      - package: Supabase
    sources:
      - path: Sources/NutriCore
        createIntermediateGroups: true
      - path: Resources/Assets.xcassets
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Legal
        buildPhase: resources
    info:
      path: NutriCore/Info.plist
      properties:
        CFBundleDisplayName: Vitalis
        CFBundleURLTypes:
          - CFBundleURLName: com.omsilwal.NutriCorePrimal
            CFBundleURLSchemes:
              - com.omsilwal.NutriCorePrimal
        # Launch: the rune, small and centred on the app's ink background. No text, no delay.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - ArchivoBlack-Regular.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSCameraUsageDescription: "Vitalis uses the camera to scan barcodes and photograph meals so it can log their nutrition."
        NSLocationWhenInUseUsageDescription: "Vitalis uses your location to find butchers and farms near you, show local weather and work out today's sunlight."
        NSHealthShareUsageDescription: "Vitalis reads activity (steps, active energy, time in daylight) to adjust your targets, and body and heart readings (weight, body fat, waist, blood pressure, resting heart rate, heart rate variability, blood glucose) to show them next to your diet. Health data stays on your iPhone."
        NSHealthUpdateUsageDescription: "Vitalis saves the calories, protein and water you log to Apple Health."
    entitlements:
      path: NutriCore/NutriCore.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.applesignin: ["Default"]
    scheme:
      # Local App Store for testing purchases in the simulator and from Xcode.
      storeKitConfiguration: Vitalis.storekit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omsilwal.NutriCorePrimal
        DEVELOPMENT_TEAM: H5KUB3S9FY
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
